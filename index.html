<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ผู้ช่วยค้นหากฎหมายสหกรณ์และเรื่องหารืออัจฉริยะ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#004E98">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="กฎหมายสหกรณ์อัจฉริยะ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;700&family=Noto+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
  :root{
    --bg:#EBEBEB; --bg-2:#004E98; --card:#FFFFFF; --accent:#FF6700; --accent-dark:#CC5200;
    --blue:#3A6EA5; --ink-text:#1A2027; --muted:#6B7280; --border:#C0C0C0; --header-text:#F5F7FA;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100vh;background:var(--bg);font-family:'Noto Sans Thai',sans-serif;color:var(--ink-text);}
  .topbar{display:flex;align-items:center;gap:12px;padding:20px;background:var(--bg-2);border-bottom:1px solid #003b73;}
  .seal{width:38px;height:38px;border-radius:50%;border:2px solid var(--header-text);display:flex;align-items:center;justify-content:center;color:var(--header-text);flex-shrink:0;}
  .seal svg{width:20px;height:20px;}
  .topbar h1{font-family:'Noto Serif Thai',serif;font-size:18px;margin:0;color:var(--header-text);}
  .topbar p{margin:2px 0 0;font-size:11.5px;color:#C9D6E5;}
  .searchrow{display:flex;gap:8px;padding:18px 20px;background:var(--bg-2);border-bottom:1px solid #003b73;max-width:760px;margin:0 auto;}
  input[type=text]{flex:1;border-radius:8px;border:1.5px solid #C0C0C0;background:#FFFFFF;color:var(--ink-text);padding:11px 12px;font-family:inherit;font-size:14.5px;}
  input[type=text]::placeholder{color:#9AA1AB;}
  input[type=text]:focus{outline:none;border-color:var(--accent);}
  button{display:flex;align-items:center;gap:7px;height:44px;background:var(--accent);color:#FFFFFF;border:none;border-radius:8px;padding:0 20px;font-weight:700;font-size:14.5px;cursor:pointer;font-family:'Noto Sans Thai',sans-serif;box-shadow:0 2px 0 var(--accent-dark);transition:transform .08s,box-shadow .08s,background .15s;flex-shrink:0;}
  button svg{width:16px;height:16px;flex-shrink:0;}
  button:hover:not(:disabled){background:#FF7D26;}
  button:active:not(:disabled){transform:translateY(2px);box-shadow:0 0 0 var(--accent-dark);}
  button:disabled{opacity:.6;box-shadow:none;cursor:default;}
  .results{padding:20px;max-width:760px;margin:0 auto;}
  .empty{margin:60px auto;text-align:center;color:var(--muted);font-size:13.5px;max-width:380px;line-height:1.8;}
  .status{text-align:center;color:var(--muted);font-size:12px;padding:8px 20px;}
  .card{background:var(--card);color:var(--ink-text);border-radius:10px;padding:16px 18px;margin-bottom:14px;border:1px solid var(--border);box-shadow:0 1px 3px rgba(26,32,39,.08);}
  .card h3{font-family:'Noto Serif Thai',serif;font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--ink-text);}
  .card h3 a{display:inline-flex;align-items:center;gap:5px;color:var(--blue);font-size:11.5px;font-family:'Noto Sans Thai',sans-serif;text-decoration:none;font-weight:600;white-space:nowrap;border:1px solid var(--blue);padding:4px 9px;border-radius:6px;}
  .card h3 a:hover{background:rgba(58,110,165,.10);}
  .card h3 a svg{width:12px;height:12px;flex-shrink:0;}
  .linkgroup{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .copybtn{display:inline-flex;align-items:center;gap:5px;background:none;border:1px solid var(--blue);color:var(--blue);height:auto;padding:4px 9px;border-radius:6px;font-size:11.5px;font-weight:600;box-shadow:none;}
  .copybtn:hover{background:rgba(58,110,165,.10);}
  .copybtn:active{transform:none;box-shadow:none;}
  .copybtn svg{width:12px;height:12px;}
  .excerpt{font-size:13.5px;line-height:1.7;padding:8px 10px;border-left:2px solid var(--accent);background:rgba(255,103,0,.06);border-radius:0 6px 6px 0;margin-bottom:8px;color:var(--ink-text);}
  .excerpt a{color:var(--blue);text-decoration:underline;word-break:break-all;}
  .count{font-size:11px;color:var(--accent-dark);font-family:'IBM Plex Mono',monospace;}
  .disclaimer{font-size:10.5px;color:var(--muted);text-align:center;padding:0 16px 20px;}

  @media (max-width:480px){
    .topbar{padding:14px 16px;gap:10px;}
    .topbar h1{font-size:16px;}
    .topbar p{font-size:10.5px;}
    .searchrow{padding:14px 16px;flex-wrap:wrap;}
    input[type=text]{width:100%;font-size:16px;} /* 16px กันเบราว์เซอร์มือถือซูมอัตโนมัติตอนแตะช่องพิมพ์ */
    button{width:100%;justify-content:center;}
    .results{padding:14px;}
    .card{padding:14px;}
    .card h3{font-size:14px;}
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="seal" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="3" x2="12" y2="19"/>
        <line x1="5" y1="7" x2="19" y2="7"/>
        <path d="M5 7 L2.6 12.2 A2.6 2.6 0 0 0 7.4 12.2 Z"/>
        <path d="M19 7 L16.6 12.2 A2.6 2.6 0 0 0 21.4 12.2 Z"/>
        <line x1="8" y1="21" x2="16" y2="21"/>
        <line x1="12" y1="19" x2="12" y2="21"/>
      </svg>
    </div>
    <div>
      <h1>ผู้ช่วยค้นหากฎหมายสหกรณ์และเรื่องหารืออัจฉริยะ</h1>
      <p>ค้นหากฎหมายสหกรณ์ สรุปกฎหมายแรงงาน และหนังสือตอบเรื่องหารือเกี่ยวกับการดำเนินงานของสหกรณ์</p>
    </div>
  </div>

  <div class="searchrow">
    <input type="text" id="input" placeholder="พิมพ์คำหรือมาตราที่ต้องการค้น เช่น ค่าชดเชย เลิกจ้าง">
    <button id="searchBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      ค้นหา
    </button>
  </div>

  <div class="status" id="status">กำลังโหลดเอกสารความรู้...</div>
  <div class="results" id="results"></div>
  <div class="disclaimer">ผลการค้นหาคือข้อความต้นฉบับจากไฟล์ในคลังความรู้ ไม่ใช่คำตอบที่สร้างขึ้นเอง ควรอ่านบริบทเต็มก่อนใช้อ้างอิงจริง</div>

<script>
  // ==== ตั้งค่า 3 อย่างนี้ให้ตรงกับ GitHub repository ของคุณ ====
  const GITHUB_OWNER = 'fat23p-eng';
  const GITHUB_REPO = 'coop-knowledge';
  const KNOWLEDGE_PATH = 'knowledge'; // ชื่อโฟลเดอร์ใน repo ที่เก็บไฟล์ .txt, .md หรือ .xlsx ความรู้
  // ==========================================================

  const input = document.getElementById('input');
  const searchBtn = document.getElementById('searchBtn');
  const resultsEl = document.getElementById('results');
  const statusEl = document.getElementById('status');

  let docs = []; // { name, url, text }
  let knowledgeReady = false;

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function linkify(escapedText) {
    return escapedText.replace(/(https?:\/\/[^\s<]+)/g, url =>
      `<a href="${url}" target="_blank" rel="noopener">${url}</a>`
    );
  }

  async function loadKnowledge() {
    try {
      const listUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${KNOWLEDGE_PATH}`;
      const listRes = await fetch(listUrl);
      if (!listRes.ok) throw new Error('เปิดโฟลเดอร์ความรู้ไม่ได้ (ตรวจสอบชื่อ owner/repo/path)');
      const files = await listRes.json();
      const knowledgeFiles = files.filter(f => f.type === 'file' && /\.(txt|md|xlsx|xls)$/i.test(f.name));

      statusEl.textContent = `กำลังเตรียมข้อมูล...`;

      let loaded = 0;
      for (const f of knowledgeFiles) {
        try {
          if (/\.(xlsx|xls)$/i.test(f.name)) {
            if (typeof XLSX === 'undefined') {
              console.warn('ข้ามไฟล์ ' + f.name + ': ไลบรารีอ่าน Excel ยังโหลดไม่เสร็จหรือถูกบล็อก');
            } else {
              const buf = await (await fetch(f.download_url)).arrayBuffer();
              const workbook = XLSX.read(buf, { type: 'array' });
              const sheet = workbook.Sheets[workbook.SheetNames[0]];
              const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
              const blocks = rows.map(row =>
                Object.entries(row)
                  .filter(([, v]) => String(v).trim() !== '')
                  .map(([k, v]) => `${k}: ${v}`)
                  .join('\n')
              ).filter(Boolean);
              docs.push({ name: f.name, url: f.html_url, text: blocks.join('\n\n') });
            }
          } else {
            const text = await (await fetch(f.download_url)).text();
            docs.push({ name: f.name, url: f.html_url, text });
          }
        } catch (fileErr) {
          console.warn('โหลดไฟล์ไม่สำเร็จ: ' + f.name, fileErr);
        }
        loaded++;
      }

      statusEl.textContent = `พร้อมค้นหา`;
      knowledgeReady = true;
      resultsEl.innerHTML = '<div class="empty">พิมพ์คำสำคัญด้านบนแล้วกดค้นหา ระบบจะแสดงย่อหน้าจากไฟล์ความรู้ที่มีคำนั้นปรากฏอยู่ พร้อมลิงก์เปิดไฟล์ต้นฉบับใน GitHub</div>';
    } catch (err) {
      statusEl.textContent = 'โหลดเอกสารความรู้ไม่สำเร็จ: ' + err.message;
    }
  }

  // สร้างชุด n-gram (กลุ่มตัวอักษร n ตัวติดกัน) จากข้อความ โดยตัดช่องว่างออกก่อน
  // วิธีนี้ไม่ต้องพึ่งการตัดคำด้วยช่องว่าง จึงใช้ได้ดีกับประโยคภาษาไทยที่พิมพ์ติดกันไม่มีช่องว่างคั่นคำ
  function ngramSet(text, n) {
    const clean = text.replace(/\s+/g, '');
    const grams = new Set();
    for (let i = 0; i <= clean.length - n; i++) {
      grams.add(clean.slice(i, i + n));
    }
    return grams;
  }

  function overlapScore(aGrams, bGrams) {
    let score = 0;
    aGrams.forEach(g => { if (bGrams.has(g)) score++; });
    return score;
  }

  function searchDocs(question) {
    const q = question.trim();
    if (q.length < 2) return [];

    const n = q.replace(/\s+/g, '').length <= 6 ? 2 : 4; // คำถามสั้นใช้ n เล็กลง ป้องกันไม่มี n-gram ให้เทียบเลย
    const qGrams = ngramSet(q, n);
    if (qGrams.size === 0) return [];

    const minScore = q.replace(/\s+/g, '').length <= 6 ? 1 : 2; // เกณฑ์ขั้นต่ำกันผลลัพธ์ไม่เกี่ยวข้องหลุดเข้ามา

    const results = [];
    docs.forEach(doc => {
      const paragraphs = doc.text.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
      const scored = paragraphs
        .map(p => ({ text: p, score: overlapScore(qGrams, ngramSet(p, n)) }))
        .filter(p => p.score >= minScore)
        .sort((a, b) => b.score - a.score);

      if (scored.length > 0) {
        results.push({
          name: doc.name,
          url: doc.url,
          excerpts: scored.slice(0, 5).map(p => p.text),
          matchCount: scored.reduce((sum, p) => sum + p.score, 0)
        });
      }
    });

    results.sort((a, b) => b.matchCount - a.matchCount);
    return results.slice(0, 8);
  }

  function renderResults(list) {
    resultsEl.innerHTML = '';
    if (!list || list.length === 0) {
      resultsEl.innerHTML = '<div class="empty">ไม่พบคำที่ค้นหาในเอกสารความรู้ ลองใช้คำอื่น หรือเพิ่มไฟล์ความรู้ที่เกี่ยวข้องเข้า repository</div>';
      return;
    }
    list.forEach(r => {
      const card = document.createElement('div');
      card.className = 'card';
      const displayName = r.name.replace(/\.(txt|md|xlsx|xls)$/i, '');
      let html = `<h3>${escapeHtml(displayName)}</h3>` +
        `<div class="count">คะแนนความเกี่ยวข้อง ${r.matchCount}</div>`;
      r.excerpts.forEach(ex => { html += `<div class="excerpt">${linkify(escapeHtml(ex))}</div>`; });
      card.innerHTML = html;
      resultsEl.appendChild(card);
    });
  }

  function handleSearch() {
    const q = input.value.trim();
    if (!q) return;
    if (!knowledgeReady) {
      statusEl.textContent = 'กำลังโหลดเอกสารความรู้อยู่ กรุณารอสักครู่แล้วลองอีกครั้ง...';
      return;
    }
    searchBtn.disabled = true;
    renderResults(searchDocs(q));
    searchBtn.disabled = false;
  }

  searchBtn.addEventListener('click', handleSearch);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') handleSearch(); });

  loadKnowledge();
</script>
</body>
</html>
